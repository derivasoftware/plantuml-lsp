# CI — plantuml-lsp. The manifest points both family dependencies at the
# public GitHub mirrors; the insteadOf rewrite resolves them against this
# GitLab's own projects (same repos, local network, job-token auth).

include:
  - project: deriva/infra/ci-templates
    ref: main
    file:
      - /templates/base.yml

test:
  stage: test
  extends: [.on-mr-and-main]
  script:
    - |
      set -euo pipefail
      # GitLab CI resolves the public GitHub dependency URLs against its
      # own projects: same repos, local network, job-token auth. The
      # public manifests keep pointing at the mirror.
      export GIT_CONFIG_GLOBAL="$CI_PROJECT_DIR/.gitconfig-ci"
      git config --file "$GIT_CONFIG_GLOBAL" \
        url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/deriva/plantuml/".insteadOf \
        "https://github.com/derivasoftware/"
      python3 -m venv .venv-ci
      ./.venv-ci/bin/pip install -q -e ".[dev]"
      mkdir -p test-results
      ./.venv-ci/bin/pytest -q \
        --junitxml=test-results/junit.xml \
        --cov=plantuml_lsp --cov-report=xml:test-results/coverage-ut.xml
