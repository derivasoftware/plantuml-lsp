[project]
name = "plantuml-lsp"
version = "0.8.7"
description = "PlantUML language server built on tree-sitter-plantuml and plantuml-fmt"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dcoello-dev" }]
requires-python = ">=3.10"
dependencies = [
    "pygls>=2,<3",
    "tree-sitter>=0.25",
    "tree-sitter-plantuml @ git+https://github.com/derivasoftware/tree-sitter-plantuml.git@v0.16.0",
    "plantuml-fmt @ git+https://github.com/derivasoftware/plantuml-fmt.git@v0.6.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
plantuml-lsp = "plantuml_lsp.server:main"

[project.urls]
Homepage = "https://github.com/derivasoftware/plantuml-lsp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
