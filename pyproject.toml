[project]
name = "plantuml-lsp"
version = "0.1.0"
description = "PlantUML language server built on tree-sitter-plantuml and plantuml-fmt"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dcoello-dev" }]
requires-python = ">=3.10"
dependencies = [
    "pygls>=1.3",
    "tree-sitter>=0.25",
    "tree-sitter-plantuml @ git+https://gitlab.semantiqa.dev/deriva/plantuml/tree-sitter-plantuml.git@v0.2.0",
    "plantuml-fmt @ git+https://gitlab.semantiqa.dev/deriva/plantuml/plantuml-fmt.git@main",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
plantuml-lsp = "plantuml_lsp.server:main"

[project.urls]
Homepage = "https://gitlab.semantiqa.dev/deriva/plantuml/plantuml-lsp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
