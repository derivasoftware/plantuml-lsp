requirement:
  id: REQ-00012-1
  title: The server shall correlate activity actions and swimlanes with methods and classes
  description: >
    The server shall correlate activity actions and swimlanes with methods and classes
  rationale: >
    An activity action is an operation: call-shaped actions
    (:calentar(objetivo);) resolve through the three call tiers with
    the active swimlane as receiver — gd lands on the declared member,
    hover shows its signature, and the drift lints reuse the tiers
    (lane class missing the method warns; no class anywhere informs).
    Swimlanes correlate with classes through the word fallback.
    References on a method name aggregate its declarations and every
    call site across the workspace — sequence labels and activity
    actions alike — closing the class↔sequence↔activity triangle.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00007-1
  tags:
    - activity
    - calls
