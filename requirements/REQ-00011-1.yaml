requirement:
  id: REQ-00011-1
  title: The server shall correlate call-shaped message labels with the receiver's declared methods
  description: >
    The server shall correlate call-shaped message labels with the receiver's declared methods
  rationale: >
    A sequence message is an invocation: moler(num_granos) on a message
    to Molinillo resolves to the declared member — by NAME only,
    arguments are free text. gd on the label lands on the member line,
    hover shows the declared signature, and a drift lint warns when the
    receiver correlates with a class that does not declare the method
    (free-text labels and classless receivers stay silent). The index
    stores per-method declaration locations for this.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00007-1
  tags:
    - calls
    - workspace
